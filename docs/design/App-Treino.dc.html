<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>App Level Up — Treino do dia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}button{font:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0C0C0C; color: #F4F4F0; font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 56px 20px 0; display: flex; justify-content: space-between; align-items: flex-start">
<div>
<p style="margin: 0; font-size: 13px; color: #A3A3A3; font-weight: 500">Quinta · Treino B</p>
<h1 style="margin: 6px 0 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 40px; line-height: 1; text-transform: uppercase">Costas<br>+ Bíceps</h1>
</div>
<button type="button" aria-label="Opções do treino" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #2A2A2A; background: transparent; color: #F4F4F0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg></button>
</div>

<div style="padding: 20px 20px 0">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #A3A3A3; margin-bottom: 8px"><span>{{feitas}} de {{total}} séries</span><span>~ 52 min</span></div>
<div style="height: 8px; border-radius: 999px; background: #222222; overflow: hidden"><div style="height: 8px; background: {{accent}}; width: {{pct}}"></div></div>
</div>

<div style="margin: 16px 20px 0; background: {{accent}}; color: #0C0C0C; border-radius: 20px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between">
<div><p style="margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px">Descanso</p><p style="margin: 2px 0 0; font-family: Anton, sans-serif; font-size: 36px; line-height: 1">01:30</p></div>
<button type="button" style="background: #0C0C0C; color: #F4F4F0; border: none; border-radius: 999px; padding: 0 20px; height: 44px; font-weight: 600; font-size: 14px">Pular</button>
</div>

<div style="flex: 1; overflow-y: auto; padding: 16px 20px 16px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{exs}}" as="e" hint-placeholder-count="3">
<div style="background: #161616; border-radius: 20px; padding: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px"><h2 style="margin: 0; font-size: 16px; font-weight: 600">{{e.nome}}</h2><span style="font-size: 12px; color: #A3A3A3">{{e.info}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{e.series}}" as="s" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; font-size: 14px">
<span style="width: 20px; color: #A3A3A3">{{s.n}}</span>
<span style="flex: 1; font-weight: 500">{{s.carga}}</span>
<span style="flex: 1; color: #BDBDB8">{{s.reps}}</span>
<sc-if value="{{s.on}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{s.toggle}}" aria-label="{{s.label}}" style="width: 44px; height: 36px; border-radius: 12px; border: none; background: {{accent}}; color: #0C0C0C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></button></sc-if>
<sc-if value="{{s.off}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{s.toggle}}" aria-label="{{s.label}}" style="width: 44px; height: 36px; border-radius: 12px; border: 1.5px solid #3A3A3A; background: transparent; color: #6B6B6B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></button></sc-if>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>

<nav style="border-top: 1px solid #222222; padding: 10px 12px 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<a href="App-Treino.dc.html" style="color: {{accent}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; min-height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>Treino</a>
<a href="App-Progresso.dc.html" style="color: #A3A3A3; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; min-height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19h16M7 15l4-4 3 3 5-6"></path></svg>Progresso</a>
<a href="App-Checkin.dc.html" style="color: #A3A3A3; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; min-height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Aulas</a>
<a href="#" style="color: #A3A3A3; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; min-height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8FF3D","options":["#C8FF3D","#FF5A1F","#3DD6FF","#FFD23D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { '0-0': true, '0-1': true, '0-2': true, '1-0': true } };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C8FF3D';
    const data = [
      { nome: 'Levantamento terra', info: '3 × 6 · RPE 8', series: [['100 kg', '6 reps'], ['100 kg', '6 reps'], ['105 kg', '5 reps']] },
      { nome: 'Remada curvada', info: '3 × 10', series: [['60 kg', '10 reps'], ['60 kg', '10 reps'], ['60 kg', '8 reps']] },
      { nome: 'Puxada frente', info: '3 × 12', series: [['55 kg', '12 reps'], ['55 kg', '12 reps'], ['55 kg', '10 reps']] },
      { nome: 'Rosca direta', info: '3 × 12', series: [['14 kg', '12 reps'], ['14 kg', '12 reps'], ['14 kg', '10 reps']] }
    ];
    const done = this.state.done;
    let feitas = 0, total = 0;
    const exs = data.map((e, i) => ({
      nome: e.nome, info: e.info,
      series: e.series.map((s, j) => {
        const k = i + '-' + j; const on = !!done[k]; total++; if (on) feitas++;
        return {
          n: j + 1, carga: s[0], reps: s[1],
          label: on ? 'Desmarcar série ' + (j + 1) : 'Concluir série ' + (j + 1),
          on: on, off: !on,
          toggle: () => this.setState({ done: { ...this.state.done, [k]: !on } })
        };
      })
    }));
    return { accent, exs, feitas, total, pct: Math.round(feitas / total * 100) + '%' };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Level Up — Logo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 1240px; box-sizing: border-box; background: #0C0C0C; color: #F4F4F0; font-family: Inter, sans-serif; padding: 64px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 460px 380px 1fr; gap: 24px">

<div style="grid-column: span 2; background: #141414; border-radius: 28px; position: relative; display: flex; align-items: center; justify-content: center; gap: 36px">
<span style="position: absolute; top: 24px; left: 28px; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #8A8A85">Logo principal</span>
<svg width="168" height="168" viewBox="0 0 64 64" role="img" aria-label="Ícone Level Up: três barras subindo, a última em forma de seta"><rect x="0" y="0" width="64" height="64" rx="14" fill="{{accent}}"></rect><rect x="11" y="38" width="10" height="15" rx="2" fill="#0C0C0C"></rect><rect x="27" y="28" width="10" height="25" rx="2" fill="#0C0C0C"></rect><path d="M43 53 V24 H39.5 L48 11 L56.5 24 H53 V53 Z" fill="#0C0C0C"></path></svg>
<div style="font-family: Anton, sans-serif; font-size: 156px; line-height: 0.9; letter-spacing: 2px">LEVEL<span style="color: {{accent}}"> UP</span></div>
</div>

<div style="background: #141414; border-radius: 28px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
<span style="position: absolute; top: 24px; left: 28px; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #8A8A85">Versão vertical</span>
<svg width="120" height="120" viewBox="0 0 64 64" aria-hidden="true"><rect x="0" y="0" width="64" height="64" rx="14" fill="{{accent}}"></rect><rect x="11" y="38" width="10" height="15" rx="2" fill="#0C0C0C"></rect><rect x="27" y="28" width="10" height="25" rx="2" fill="#0C0C0C"></rect><path d="M43 53 V24 H39.5 L48 11 L56.5 24 H53 V53 Z" fill="#0C0C0C"></path></svg>
<div style="font-family: Anton, sans-serif; font-size: 88px; line-height: 0.9; text-align: center">LEVEL<br><span style="color: {{accent}}">UP</span></div>
</div>

<div style="background: {{accent}}; color: #0C0C0C; border-radius: 28px; position: relative; display: flex; align-items: center; justify-content: center; gap: 18px">
<span style="position: absolute; top: 24px; left: 28px; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #2B2B2B">Sobre a cor da marca</span>
<svg width="80" height="80" viewBox="0 0 64 64" aria-hidden="true"><rect x="0" y="0" width="64" height="64" rx="14" fill="#0C0C0C"></rect><rect x="11" y="38" width="10" height="15" rx="2" fill="{{accent}}"></rect><rect x="27" y="28" width="10" height="25" rx="2" fill="{{accent}}"></rect><path d="M43 53 V24 H39.5 L48 11 L56.5 24 H53 V53 Z" fill="{{accent}}"></path></svg>
<div style="font-family: Anton, sans-serif; font-size: 72px; line-height: 0.9">LEVEL UP</div>
</div>

<div style="background: #F4F4F0; color: #0C0C0C; border-radius: 28px; position: relative; display: flex; align-items: center; justify-content: center; gap: 18px">
<span style="position: absolute; top: 24px; left: 28px; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #4A4A4A">Fundo claro</span>
<svg width="80" height="80" viewBox="0 0 64 64" aria-hidden="true"><rect x="0" y="0" width="64" height="64" rx="14" fill="#0C0C0C"></rect><rect x="11" y="38" width="10" height="15" rx="2" fill="{{accent}}"></rect><rect x="27" y="28" width="10" height="25" rx="2" fill="{{accent}}"></rect><path d="M43 53 V24 H39.5 L48 11 L56.5 24 H53 V53 Z" fill="{{accent}}"></path></svg>
<div style="font-family: Anton, sans-serif; font-size: 72px; line-height: 0.9">LEVEL UP</div>
</div>

<div style="background: #141414; border-radius: 28px; position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 28px; padding-bottom: 72px; box-sizing: border-box">
<span style="position: absolute; top: 24px; left: 28px; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #8A8A85">Ícone do app</span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px"><svg width="120" height="120" viewBox="0 0 64 64" aria-hidden="true"><rect x="0" y="0" width="64" height="64" rx="14" fill="{{accent}}"></rect><rect x="11" y="38" width="10" height="15" rx="2" fill="#0C0C0C"></rect><rect x="27" y="28" width="10" height="25" rx="2" fill="#0C0C0C"></rect><path d="M43 53 V24 H39.5 L48 11 L56.5 24 H53 V53 Z" fill="#0C0C0C"></path></svg><span style="font-size: 13px; color: #BDBDB8">Level Up</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="0" y="0" width="64" height="64" rx="14" fill="{{accent}}"></rect><rect x="11" y="38" width="10" height="15" rx="2" fill="#0C0C0C"></rect><rect x="27" y="28" width="10" height="25" rx="2" fill="#0C0C0C"></rect><path d="M43 53 V24 H39.5 L48 11 L56.5 24 H53 V53 Z" fill="#0C0C0C"></path></svg><span style="font-size: 12px; color: #8A8A85">64 px</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px"><svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><rect x="0" y="0" width="64" height="64" rx="14" fill="{{accent}}"></rect><rect x="11" y="38" width="10" height="15" rx="2" fill="#0C0C0C"></rect><rect x="27" y="28" width="10" height="25" rx="2" fill="#0C0C0C"></rect><path d="M43 53 V24 H39.5 L48 11 L56.5 24 H53 V53 Z" fill="#0C0C0C"></path></svg><span style="font-size: 12px; color: #8A8A85">32 px</span></div>
</div>

<div style="grid-column: span 3; background: #141414; border-radius: 28px; padding: 28px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="display: flex; gap: 14px; align-items: center">
<div style="width: 64px; height: 64px; border-radius: 16px; background: {{accent}}"></div>
<div><p style="margin: 0; font-size: 15px; font-weight: 600">Verde-limão</p><p style="margin: 2px 0 0; font-size: 13px; color: #A3A3A3">{{accentLabel}}</p></div>
</div>
<div style="display: flex; gap: 14px; align-items: center">
<div style="width: 64px; height: 64px; border-radius: 16px; background: #0C0C0C; border: 1.5px solid #3A3A3A; box-sizing: border-box"></div>
<div><p style="margin: 0; font-size: 15px; font-weight: 600">Preto</p><p style="margin: 2px 0 0; font-size: 13px; color: #A3A3A3">#0C0C0C</p></div>
</div>
<div style="display: flex; gap: 14px; align-items: center">
<div style="width: 64px; height: 64px; border-radius: 16px; background: #F4F4F0"></div>
<div><p style="margin: 0; font-size: 15px; font-weight: 600">Off-white</p><p style="margin: 2px 0 0; font-size: 13px; color: #A3A3A3">#F4F4F0</p></div>
</div>
<div style="margin-left: auto; display: flex; gap: 40px; align-items: baseline">
<div><p style="margin: 0; font-family: Anton, sans-serif; font-size: 40px">Anton</p><p style="margin: 2px 0 0; font-size: 13px; color: #A3A3A3">Títulos e logo</p></div>
<div><p style="margin: 0; font-size: 32px; font-weight: 600">Inter</p><p style="margin: 2px 0 0; font-size: 13px; color: #A3A3A3">Textos e interface</p></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8FF3D","options":["#C8FF3D","#FF5A1F","#3DD6FF","#FFD23D"]},"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8FF3D';
    return { accent, accentLabel: accent.toUpperCase() };
  }
}
</script>
</body>
</html>

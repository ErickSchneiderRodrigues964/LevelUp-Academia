<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Level Up — Post de matrícula</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.ph{background:repeating-linear-gradient(135deg,#1A1A1A 0 16px,#141414 16px 32px)}</style>

<div style="width: 1080px; height: 1350px; box-sizing: border-box; background: {{fundo}}; color: #0C0C0C; font-family: Inter, sans-serif; padding: 72px; display: flex; flex-direction: column; gap: 40px; overflow: hidden">

</div>
<h1 style="margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 210px; line-height: 0.88; text-transform: uppercase; letter-spacing: -2px">Matrícula<br>zero.</h1>
<div style="display: flex; gap: 32px; flex: 1; min-height: 0">
<div class="ph" style="flex: 1.3; border-radius: 32px; display: flex; align-items: flex-end; padding: 28px; box-sizing: border-box"><span style="font-size: 20px; color: #8A8A85">[FOTO: aluno em close, suor, contraste alto]</span></div>
<div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 24px">
<div style="background: #0C0C0C; color: #F4F4F0; border-radius: 32px; padding: 36px; display: flex; flex-direction: column; gap: 8px">

</div>
<div style="display: flex; flex-direction: column; gap: 14px; font-size: 28px; font-weight: 700">
<span>✓  Avaliação física grátis</span>
<span>✓  Aulas coletivas inclusas</span>
<span>✓  App de treino</span>
</div>
</div>
</div>
<div style="border-top: 3px solid #0C0C0C; padding-top: 28px; display: flex; justify-content: space-between; font-size: 26px; font-weight: 700">
<span>@[INSTAGRAM]</span>
<span>Link na bio</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fundo":{"editor":"color","default":"#FF5A1F","options":["#FF5A1F","#C8FF3D","#FFD23D","#3DD6FF"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return { fundo: this.props.fundo ?? '#FF5A1F' };
  }
}
</script>

</html>

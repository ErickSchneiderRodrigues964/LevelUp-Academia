<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>App Level Up — Progresso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}button{font:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0C0C0C; color: #F4F4F0; font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; overflow-y: auto; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 16px">
<div>
<p style="margin: 0; font-size: 13px; color: #A3A3A3; font-weight: 500">Novembro</p>
<h1 style="margin: 6px 0 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 40px; line-height: 1; text-transform: uppercase">Seu progresso</h1>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="background: {{accent}}; color: #0C0C0C; border-radius: 20px; padding: 16px"><p style="margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px">Sequência</p><p style="margin: 6px 0 0; font-family: Anton, sans-serif; font-size: 44px; line-height: 1">12<span style="font-family: Inter, sans-serif; font-size: 14px; font-weight: 600"> dias</span></p></div>
<div style="background: #161616; border-radius: 20px; padding: 16px"><p style="margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #A3A3A3">Treinos no mês</p><p style="margin: 6px 0 0; font-family: Anton, sans-serif; font-size: 44px; line-height: 1">9<span style="font-family: Inter, sans-serif; font-size: 14px; color: #A3A3A3"> / 16</span></p></div>
</div>

<div style="background: #161616; border-radius: 20px; padding: 18px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 16px; font-weight: 600">Volume semanal</h2><span style="font-size: 12px; color: #A3A3A3">toneladas</span></div>
<div role="img" aria-label="Volume semanal das últimas 6 semanas, subindo de 14 para 21 toneladas" style="margin-top: 16px; height: 140px; display: flex; align-items: flex-end; gap: 10px">
<sc-for list="{{barras}}" as="b" hint-placeholder-count="6">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="font-size: 11px; color: #BDBDB8">{{b.v}}</span>
<div style="width: 100%; border-radius: 8px; height: {{b.h}}; background: {{b.cor}}"></div>
<span style="font-size: 11px; color: #A3A3A3">{{b.s}}</span>
</div>
</sc-for>
</div>
</div>

<div style="background: #161616; border-radius: 20px; padding: 18px">
<h2 style="margin: 0 0 12px; font-size: 16px; font-weight: 600">Recordes pessoais</h2>
<sc-for list="{{prs}}" as="p" hint-placeholder-count="3">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid #262626">
<div><p style="margin: 0; font-size: 15px; font-weight: 500">{{p.ex}}</p><p style="margin: 2px 0 0; font-size: 12px; color: #A3A3A3">{{p.data}}</p></div>
<div style="text-align: right"><p style="margin: 0; font-family: Anton, sans-serif; font-size: 24px">{{p.kg}}</p><p style="margin: 0; font-size: 12px; font-weight: 600; color: {{accent}}">{{p.delta}}</p></div>
</div>
</sc-for>
</div>

<a href="#" style="background: #161616; border-radius: 20px; padding: 18px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: #F4F4F0">
<div><p style="margin: 0; font-size: 15px; font-weight: 600">Próxima avaliação física</p><p style="margin: 2px 0 0; font-size: 13px; color: #A3A3A3">Agende com seu professor</p></div>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</div>

<nav style="border-top: 1px solid #222222; padding: 10px 12px 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<a href="App-Treino.dc.html" style="color: #A3A3A3; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; min-height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>Treino</a>
<a href="App-Progresso.dc.html" style="color: {{accent}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; min-height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19h16M7 15l4-4 3 3 5-6"></path></svg>Progresso</a>
<a href="App-Checkin.dc.html" style="color: #A3A3A3; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; min-height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Aulas</a>
<a href="#" style="color: #A3A3A3; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; min-height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8FF3D","options":["#C8FF3D","#FF5A1F","#3DD6FF","#FFD23D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8FF3D';
    const vals = [14, 15.5, 15, 17.5, 19, 21];
    const max = 21;
    const barras = vals.map((v, i) => ({
      v: String(v).replace('.', ','), s: 'S' + (i + 1),
      h: Math.round(v / max * 96) + 'px',
      cor: i === vals.length - 1 ? accent : '#3A3A3A'
    }));
    return {
      accent, barras,
      prs: [
        { ex: 'Levantamento terra', data: '07 nov', kg: '110 kg', delta: '+10 kg' },
        { ex: 'Agachamento livre', data: '31 out', kg: '90 kg', delta: '+5 kg' },
        { ex: 'Supino reto', data: '24 out', kg: '72 kg', delta: '+4 kg' }
      ]
    };
  }
}
</script>
</body>
</html>

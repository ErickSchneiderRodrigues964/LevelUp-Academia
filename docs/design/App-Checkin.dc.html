<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>App Level Up — Check-in e aulas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}button{font:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0C0C0C; color: #F4F4F0; font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; overflow-y: auto; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 40px; line-height: 1; text-transform: uppercase">Check-in</h1>

<div style="background: #F4F4F0; color: #0C0C0C; border-radius: 24px; padding: 20px; display: flex; gap: 16px; align-items: center">
<div role="img" aria-label="QR code de acesso à catraca" style="width: 112px; height: 112px; flex: none; border-radius: 12px; background: repeating-conic-gradient(#0C0C0C 0 25%, #F4F4F0 0 50%) 0 0 / 16px 16px; border: 8px solid #FFFFFF; box-sizing: border-box"></div>
<div>
<p style="margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #4A4A4A">Acesso liberado</p>
<p style="margin: 6px 0 0; font-size: 18px; font-weight: 700">Aproxime da catraca</p>
<p style="margin: 6px 0 0; font-size: 13px; color: #4A4A4A">Plano Semestral · ativo</p>
</div>
</div>

<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 600">Aulas coletivas</h2><span style="font-size: 13px; color: #A3A3A3">Novembro</span></div>

<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{dias}}" as="d" hint-placeholder-count="5">
<sc-if value="{{d.sel}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{d.pick}}" aria-pressed="true" style="height: 64px; border-radius: 16px; border: none; background: {{accent}}; color: #0C0C0C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer"><span style="font-size: 11px; font-weight: 600">{{d.sem}}</span><span style="font-size: 18px; font-weight: 700">{{d.num}}</span></button></sc-if>
<sc-if value="{{d.nsel}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{d.pick}}" aria-pressed="false" style="height: 64px; border-radius: 16px; border: 1.5px solid #2A2A2A; background: transparent; color: #F4F4F0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer"><span style="font-size: 11px; color: #A3A3A3">{{d.sem}}</span><span style="font-size: 18px; font-weight: 600">{{d.num}}</span></button></sc-if>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{aulas}}" as="a" hint-placeholder-count="4">
<div style="background: #161616; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 14px">
<div style="width: 56px; flex: none"><p style="margin: 0; font-size: 16px; font-weight: 700">{{a.h}}</p><p style="margin: 2px 0 0; font-size: 12px; color: #A3A3A3">{{a.dur}}</p></div>
<div style="flex: 1; min-width: 0"><p style="margin: 0; font-size: 15px; font-weight: 600">{{a.nome}}</p><p style="margin: 2px 0 0; font-size: 12px; color: #A3A3A3">{{a.vagas}}</p></div>
<sc-if value="{{a.res}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{a.toggle}}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: none; background: {{accent}}; color: #0C0C0C; font-size: 13px; font-weight: 700; cursor: pointer">Reservado</button></sc-if>
<sc-if value="{{a.nres}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{a.toggle}}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #3A3A3A; background: transparent; color: #F4F4F0; font-size: 13px; font-weight: 600; cursor: pointer">Reservar</button></sc-if>
</div>
</sc-for>
</div>
</div>

<nav style="border-top: 1px solid #222222; padding: 10px 12px 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<a href="App-Treino.dc.html" style="color: #A3A3A3; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; min-height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>Treino</a>
<a href="App-Progresso.dc.html" style="color: #A3A3A3; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; min-height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19h16M7 15l4-4 3 3 5-6"></path></svg>Progresso</a>
<a href="App-Checkin.dc.html" style="color: {{accent}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; min-height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Aulas</a>
<a href="#" style="color: #A3A3A3; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; min-height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8FF3D","options":["#C8FF3D","#FF5A1F","#3DD6FF","#FFD23D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dia: 0, res: { '0-1': true } };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C8FF3D';
    const sems = ['Qui', 'Sex', 'Sáb', 'Seg', 'Ter'];
    const nums = [12, 13, 14, 16, 17];
    const dias = sems.map((s, i) => ({ sem: s, num: nums[i], sel: this.state.dia === i, nsel: this.state.dia !== i, pick: () => this.setState({ dia: i }) }));
    const grades = [
      [['06:00', 'Cross training', '45 min', 3], ['18:30', 'Muay thai', '60 min', 6], ['20:00', 'Spinning', '45 min', 0], ['20:00', 'Mobilidade', '30 min', 9]],
      [['07:30', 'Mobilidade', '30 min', 10], ['12:00', 'Spinning', '45 min', 4], ['18:30', 'Cross training', '45 min', 2]],
      [['09:00', 'Cross training', '60 min', 8], ['10:30', 'Muay thai', '60 min', 5]],
      [['06:00', 'Cross training', '45 min', 7], ['12:00', 'Spinning', '45 min', 1], ['18:30', 'Muay thai', '60 min', 4], ['20:00', 'Cross training', '45 min', 6]],
      [['07:30', 'Muay thai', '60 min', 6], ['18:30', 'Spinning', '45 min', 3], ['20:00', 'Mobilidade', '30 min', 11]]
    ];
    const d = this.state.dia;
    const aulas = grades[d].map((a, j) => {
      const k = d + '-' + j; const on = !!this.state.res[k];
      return {
        h: a[0], nome: a[1], dur: a[2],
        vagas: on ? 'Sua vaga está garantida' : (a[3] === 0 ? 'Lista de espera' : a[3] + (a[3] === 1 ? ' vaga' : ' vagas')),
        res: on, nres: !on,
        toggle: () => this.setState({ res: { ...this.state.res, [k]: !on } })
      };
    });
    return { accent, dias, aulas };
  }
}
</script>
</body>
</html>
